name: TorneAR CI

# Se ejecuta en cada Pull Request hacia main (Producción) y develop (Staging),
# y también al pushear directo a esas ramas. Si cualquier paso falla, el check
# queda en rojo y (con branch protection activada) bloquea el merge del PR.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancela corridas anteriores del mismo PR/rama para no gastar minutos de más.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check · Lint · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # npm ci = install reproducible desde package-lock.json (falla si está desincronizado).
      - name: Install dependencies
        run: npm ci

      # 1) TypeScript en modo estricto, sin emitir. Falla ante cualquier error de tipos.
      - name: Type Check (tsc)
        run: npx tsc --noEmit

      # 2) ESLint (config de Expo). Falla ante errores de lint.
      - name: Lint (eslint)
        run: npm run lint

      # 3) Suite de tests (Vitest, una sola corrida). Falla si algún test no pasa.
      - name: Tests (vitest)
        run: npm test

  # ─── Tests de base de datos (LEGACY · en extinción) ─────────────────────────
  # Ejecuta las suites SQL imperativas de supabase/tests-legacy/ (listadas en
  # ci-manifest.txt) contra la base del proyecto vía pooler. Es SEGURO: cada
  # suite corre íntegramente en BEGIN...ROLLBACK y jamás persiste datos; si
  # una regresión reaparece, el bloque lanza EXCEPTION y el job queda en rojo.
  #
  # Configuración (una sola vez): crear el secret SUPABASE_DB_URL en
  # Settings → Secrets and variables → Actions, con la connection string del
  # Session Pooler (Dashboard → Connect → Session pooler URI). Si el secret no
  # está definido (p. ej. en forks), el job se omite con un warning en lugar
  # de fallar.
  #
  # Plan de migración (chore/pgtap-ci): cada suite migrada a pgTAP se borra de
  # tests-legacy/ y de su manifest. Cuando el manifest quede vacío, este job
  # y el secret SUPABASE_DB_URL se eliminan. Las suites nuevas van SIEMPRE en
  # supabase/tests/ (pgTAP, job db-tests-pgtap).
  db-tests-legacy:
    name: Database tests (legacy · SQL imperativo)
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verificar configuración del secret
        id: guard
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_URL no está configurado — se omiten los tests de base de datos."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar suites SQL (BEGIN…ROLLBACK)
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            # saltear líneas vacías y comentarios del manifest
            [ -z "$file" ] && continue
            case "$file" in \#*) continue ;; esac
            echo "══════════════════════════════════════════════"
            echo "▶ supabase/tests-legacy/$file"
            if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/tests-legacy/$file"; then
              echo "✅ $file"
            else
              echo "❌ $file"
              failed=1
            fi
          done < supabase/tests-legacy/ci-manifest.txt
          exit "$failed"

  # ─── Tests de base de datos (pgTAP · stack efímero) ─────────────────────────
  # Levanta un stack local de Supabase DESDE CERO en el runner (aplica las
  # migraciones completas + supabase/seed.sql) y corre las suites declarativas
  # de supabase/tests/ con pg_prove (supabase test db). Ventajas sobre el job
  # legacy: hermético (no toca la base real ni compite entre PRs), corre en
  # forks sin secrets, y valida en cada PR que la cadena de migraciones
  # aplica limpia desde cero.
  #
  # -x excluye los servicios que los tests de DB no usan (studio, buckets,
  # realtime, edge functions, mail, analytics...). Quedan corriendo Postgres,
  # auth y kong. OJO: los nombres válidos dependen de la versión del CLI
  # (`supabase start --help`); `gotrue` no es excluible y `logflare` se
  # llama `analytics`.
  #
  # pgTAP y el schema tests.* los instala supabase/tests/000-setup.sql al
  # inicio de la corrida — nunca via migración, así jamás llegan a Producción.
  db-tests-pgtap:
    name: Database tests (pgTAP · stack efímero)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start ephemeral stack (migraciones + seed)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,functions,realtime,storage,analytics,vector,meta,rest

      - name: Run pgTAP suites (supabase test db)
        run: supabase test db
